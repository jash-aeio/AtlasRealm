# pnpm settings (pnpm 10+ keeps them here even for a single-package repo).
# Dependency install scripts are blocked unless listed below with `true`.
# Every allowance needs a reason in its commit message (ADR-0007).
# Note: electron 45 has no install script; it downloads its binary on first launch
# (CI does this explicitly with retries, see .github/workflows/ci.yml).
allowBuilds: {}
