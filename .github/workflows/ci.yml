name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: windows-latest # the app targets Windows first; native modules must build here
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the "packageManager" field in package.json (ADR-0007).
      # It must be set up before setup-node so setup-node can cache the pnpm store.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # Electron 45 bundles Node 24
          cache: pnpm

      - name: Validate repo config (JSON + hook scripts)
        shell: bash
        run: |
          for f in .claude/settings.json .mcp.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"; done
          for f in .claude/hooks/*.mjs; do node --check "$f" && echo "ok $f"; done

      - name: Install
        run: pnpm install --frozen-lockfile # fails if package.json and the lockfile disagree

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # Electron downloads its binary from GitHub Releases on first launch (checked against
      # the checksums shipped in the package). Do it up front with retries, so a transient
      # 5xx from the release server doesn't fail the E2E step (happened on PR #15).
      - name: Download Electron binary
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm exec install-electron && exit 0
            echo "Electron download failed (attempt $attempt of 3), retrying in 20s..."
            sleep 20
          done
          exit 1

      # Builds the app and launches the real Electron window (windows-latest has a desktop
      # session, so no virtual display is needed). Probes the renderer's security boundary.
      - name: E2E (Playwright + Electron)
        run: pnpm test:e2e

      # Windows packaging (#10). electron-builder downloads Electron and NSIS from GitHub
      # Releases, so retry like the Electron download above.
      - name: Package (electron-builder, NSIS)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm package && exit 0
            echo "Packaging failed (attempt $attempt of 3), retrying in 20s..."
            sleep 20
          done
          exit 1

      # Runs the packaged .exe from a path with spaces and non-ASCII characters, checks that
      # data survives a restart, that assets load only from app://, and that the fuses hold.
      - name: E2E (packaged app)
        run: pnpm test:e2e:packaged

      # The unsigned installer, for trying a PR build by hand. Not a release.
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: AtlasRealm-Setup-unsigned
          path: release/AtlasRealm-Setup-*.exe
          retention-days: 7
          if-no-files-found: error
