name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: windows-latest # the app targets Windows first; native modules must build here
    steps:
      - uses: actions/checkout@v4

      - name: Validate repo config (JSON + hook scripts)
        shell: bash
        run: |
          for f in .claude/settings.json .mcp.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"; done
          for f in .claude/hooks/*.mjs; do node --check "$f" && echo "ok $f"; done

      - name: Detect app scaffold
        id: app
        shell: bash
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No package.json yet (pre-M0-1): app checks skipped."; fi

      # Enabled automatically once M0-1 adds package.json. M0-1 should finalize these steps
      # (package manager per ADR, cache, exact script names).
      - uses: pnpm/action-setup@v6
        if: steps.app.outputs.present == 'true' && hashFiles('pnpm-lock.yaml') != ''
      - uses: actions/setup-node@v4
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 24
      - name: Install
        if: steps.app.outputs.present == 'true'
        shell: bash
        run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else npm ci; fi
      - name: Typecheck
        if: steps.app.outputs.present == 'true'
        run: npm run typecheck --if-present
      - name: Lint
        if: steps.app.outputs.present == 'true'
        run: npm run lint --if-present
      - name: Test
        if: steps.app.outputs.present == 'true'
        run: npm test --if-present
