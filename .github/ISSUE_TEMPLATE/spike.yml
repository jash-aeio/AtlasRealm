name: Spike
description: A time-boxed experiment to answer a risky question before committing to a design
title: "spike: "
labels: ["type:spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time box
      placeholder: "4 hours"
  - type: textarea
    id: success
    attributes:
      label: What result would let us decide?
  - type: textarea
    id: outcome
    attributes:
      label: Outcome (fill in when done; link the ADR)
